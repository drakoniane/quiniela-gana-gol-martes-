<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUINIELAS GANA-GOL</title>
<style>
*{box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;margin:0;padding:10px;text-align:center}
.top{padding:15px 0 5px}
h1{color:#FFD700;font-size:26px;margin:0;text-shadow:0 0 10px #FFD700}
p{color:#ccc;margin:5px 0}
table{border-collapse:collapse;width:100%;max-width:600px;margin:15px auto;background:#111}
th,td{border:1px solid #333;padding:10px;font-size:14px}
th{background:#FFD700;color:#000}
td:first-child{text-align:left}
input[type="checkbox"]{width:22px;height:22px;accent-color:#FFD700}
.precio{background:#FFD700;color:#000;font-weight:bold;padding:12px;border-radius:10px;max-width:600px;margin:15px auto;font-size:18px}
button{background:#25D366;color:#fff;border:none;padding:15px 25px;font-size:18px;font-weight:bold;border-radius:10px;width:100%;max-width:600px}
input[type="text"]{width:100%;max-width:600px;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #333;background:#111;color:#fff;font-size:16px}
</style>
</head>
<body>
<div class="top">
<h1>QUINIELAS GANA-GOL</h1>
<p>Quiniela Martes - Elige Local / Empate / Visita</p>
</div>

<input type="text" id="nombre" placeholder="Escribe tu nombre">

<table id="tabla"></table>

<div class="precio">Costo: $50 - Premio al ganador</div>

<button onclick="enviar()">ENVIAR POR WHATSAPP</button>

<script>
const partidos=[
["HONDURAS","IRLANDA DEL NORTE"],
["CHILE","COLOMBIA"],
["MEXICO","ESTADOS UNIDOS"],
["BRASIL","ARGENTINA"],
["ESPAÑA","FRANCIA"],
["ALEMANIA","ITALIA"],
["INGLATERRA","PORTUGAL"],
["HOLANDA","BELGICA"],
["URUGUAY","PARAGUAY"],
["PERU","ECUADOR"]
];
let html="<tr><th>#</th><th>PARTIDO</th><th>L</th><th>E</th><th>V</th></tr>";
partidos.forEach((p,i)=>{
html+=`<tr><td>${i+1}</td><td>${p[0]} vs ${p[1]}</td><td><input type="checkbox" class="l${i}"></td><td><input type="checkbox" class="e${i}"></td><td><input type="checkbox" class="v${i}"></td></tr>`;
});
document.getElementById("tabla").innerHTML=html;

function enviar(){
let nombre=document.getElementById("nombre").value || "Sin nombre";
let texto="QUINIELA GANA-GOL MARTES%0A%0ANombre: "+nombre+"%0A%0A";
partidos.forEach((p,i)=>{
let r="";
if(document.querySelector(".l"+i).checked) r+="L ";
if(document.querySelector(".e"+i).checked) r+="E ";
if(document.querySelector(".v"+i).checked) r+="V ";
if(!r) r="SIN MARCAR";
texto+=`${i+1}. ${p[0]} vs ${p[1]}: ${r}%0A`;
});
window.open("https://wa.me/5210000000000?text="+texto,"_blank");
}
</script>
</body>
</html>
